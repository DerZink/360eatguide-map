name: 360EatGuide Pipeline

on:

  workflow_dispatch:

  schedule:
    # wöchtl um 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            lxml

      - name: Create Folders
        run: |
          mkdir -p data
          mkdir -p docs

      - name: Scrape Restaurant List
        run: |
          python scripts/scrape.py

      - name: Enrich Detail Pages
        run: |
          python scripts/enrich.py

      - name: Geocode Locations
        run: |
          python scripts/geocode.py

      - name: Generate Leaflet Map
        run: |
          python scripts/generate_map.py

      - name: Upload JSON Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: |
            data/*.json

      - name: Upload HTML Map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaflet-map
          path: |
            docs/index.html

      - name: Commit Changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/*.json
          git add docs/index.html

          if git diff --cached --quiet
          then
            echo "No changes detected"
          else
            git commit -m "Automatic daily update"
            git push origin main
          fi
