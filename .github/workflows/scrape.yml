# .github/workflows/scrape.yml

name: 360EatGuide Pipeline

on:

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4

      - name: Create folders
        run: |
          mkdir -p data
          mkdir -p docs

      - name: Scrape restaurant list
        run: |
          python scripts/scrape.py

      - name: Enrich detail pages
        run: |
          python scripts/enrich.py

      - name: Geocode locations
        run: |
          python scripts/geocode.py

      - name: Generate GeoJSON
        run: |
          python scripts/generate_map.py

      - name: Upload debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug_page_*.html

      - name: Upload restaurants json
        if: always()
        uses: actions/upload-artifact@v
