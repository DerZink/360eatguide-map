# .github/workflows/scrape.yml

name: 360EatGuide Scraper

on:

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Create folders
        run: |
          mkdir -p data

      - name: Run restaurant scraper
        run: |
          python scripts/scrape.py

      - name: Run detail scraper
        run: |
          python scripts/enrich.py

      - name: Upload debug html pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug_page_*.html

      - name: Upload raw json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurants-hotels-json
          path: |
            data/restaurants_hotels.json

      - name: Upload enriched json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurants-hotels-enriched
          path: |
            data/restaurants_hotels_enriched.json

      - name: Commit updates
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Update 360EatGuide data"
            git push
          fi
