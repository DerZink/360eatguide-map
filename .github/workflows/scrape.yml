name: Scrape 360EatGuide

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Create data folder
        run: |
          mkdir -p data

      - name: Run scraper
        run: |
          python scripts/scrape.py

      - name: Upload debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug_page_*.html

      - name: Upload generated json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurants-hotels-json
          path: |
            data/restaurants_hotels.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/restaurants_hotels.json

          git diff --cached --quiet || git commit -m "Update restaurant data"

          git push
