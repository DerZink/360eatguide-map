<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>360°Eat Guide Testkarte</title>

    https://unpkg.com/leaflet@1.9.4/dist/leaflet.css

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>
    const map = L.map('map').setView([47.4979, 19.0402], 5);

    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '© OpenStreetMap'
        }
    ).addTo(map);

    const restaurantIcon = {
        radius: 8,
        color: "#0066ff",
        fillColor: "#0066ff",
        fillOpacity: 0.8
    };

    const hotelIcon = {
        radius: 8,
        color: "#ff0000",
        fillColor: "#ff0000",
        fillOpacity: 0.8
    };

    L.circleMarker([47.3769, 8.5417], restaurantIcon)
        .addTo(map)
        .bindPopup(`
            <b>Test Restaurant</b><br>
            <a href="https://360eatguide.com/" target="_blank">
                Eintrag öffnen
            </a>
        `);

    L.circleMarker([46.8182, 8.2275], hotelIcon)
        .addTo(map)
        .bindPopup(`
            <b>Test Hotel</b><br>
            <a href="https://360eatguide.com/" target="_blank">
                Eintrag öffnen
            </a>
        `);
</script>

</body>
</html>
